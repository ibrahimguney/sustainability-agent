# Streamlit Cloud Secrets örneği
# Streamlit Cloud panelinde:
# App → Settings → Secrets alanına aşağıdakileri kendi bilgilerinizle giriniz.

OPENAI_API_KEY = "sk-..."

# Lokal Docker PostgreSQL Streamlit Cloud'da çalışmaz.
# Streamlit Cloud için Supabase, Neon, Railway, Render veya Google Cloud SQL gibi
# dışarıdan erişilebilir PostgreSQL kullanmanız gerekir.
DATABASE_URL = "postgresql://USER:PASSWORD@HOST:5432/DATABASE"

# İlk admin kullanıcısı için kullanılır.
# Uygulama açıldığında app_users tablosunda yoksa oluşturulur.
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "güçlü-bir-şifre"